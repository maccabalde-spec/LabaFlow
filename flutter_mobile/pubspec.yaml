name: labaflow_mobile
description: LabaFlow laundry management application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.18.3
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/labaflow.html
    - assets/supabase-config.js
    - assets/supabase-web-auth.js
    - assets/images/
