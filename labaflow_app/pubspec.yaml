name: labaflow_app
description: LabaFlow - Lab-a-Day Laundry Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/labaflow.html
    - assets/supabase-config.js
    - assets/supabase-web-auth.js
    - assets/gcash_qr.png
    - assets/manifest.json
    - assets/sw.js
    - assets/firebase-config.js
    - assets/firebase-web-auth.js
