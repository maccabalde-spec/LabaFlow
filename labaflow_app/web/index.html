<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LabaFlow - Lab-a-Day Laundry Management System">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LabaFlow">
  <title>LabaFlow – Lab-a-Day Laundry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>
  <style>
    body {
      margin: 0;
      background-color: #0a1628;
      overflow: hidden;
    }
    /* Splash screen */
    #splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #0a1628;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #splash h1 {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 28px;
      font-weight: 900;
      margin: 0 0 8px 0;
    }
    #splash h1 span { color: #0284c7; }
    #splash p {
      color: #5a7fa8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      margin: 0 0 32px 0;
    }
    #splash .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(56,189,248,0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #splash.hidden { opacity: 0; pointer-events: none; }
  </style>
  <script>
    const serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Splash screen shown while Flutter loads -->
  <div id="splash">
    <h1>Laba<span>Flow</span></h1>
    <p>Lab-a-Day Laundry Management System</p>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Hide splash when Flutter mounts
      function hideSplash() {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(() => splash.remove(), 500);
        }
      }

      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            // Give Flutter a moment to paint before hiding splash
            setTimeout(hideSplash, 800);
          });
        }
      });
    });
  </script>
</body>
</html>
